[package]
name = "spool"
version.workspace = true
edition.workspace = true

[dependencies]
spool-core = { path = "../core" }
directories = "6"
iced = { version = "0.13", features = ["tokio", "svg", "image"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }

[build-dependencies]
winresource = "0.1"
